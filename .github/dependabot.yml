version: 2
updates:
  - package-ecosystem: pip
    directory: /glama
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # The CodeQL steps refuse to run at different versions, so they move
    # together in one pull request.
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"

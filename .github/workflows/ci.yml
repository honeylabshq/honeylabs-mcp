name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: python stub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r glama/requirements.txt
      - name: Compile
        run: python -m compileall glama
      - name: Import stub server (registers tools, does not start it)
        run: python -c "import sys; sys.path.insert(0, 'glama'); import stub_server; print('tools registered')"

  stub-drift:
    name: stub matches production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Directories score this stub, not production, so a tool that exists in one
      # and not the other is invisible to them. MCP discovery is ungated on
      # production, so this needs no credential. Uses stdlib only.
      - name: Compare stub tools against the live tools/list
        run: python scripts/check_stub_drift.py

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the Glama image
        run: docker build -t honeylabs-mcp:ci .

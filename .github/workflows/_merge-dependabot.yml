name: merge-dependabot-once

# One-shot: merges the currently-open Dependabot PRs using the built-in
# Actions token, then this file is removed. Runs on push because there is
# no local token to trigger workflow_dispatch.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          prs=$(gh pr list --repo "$REPO" --state open --json number,author \
                --jq '.[] | select(.author.login=="dependabot[bot]") | .number' | sort -n)
          echo "dependabot PRs: $prs"
          for pr in $prs; do
            for attempt in 1 2 3 4 5; do
              if gh pr merge "$pr" --repo "$REPO" --squash --delete-branch; then
                echo "merged #$pr"; break
              fi
              echo "retry #$pr (attempt $attempt)"; sleep 12
            done
          done

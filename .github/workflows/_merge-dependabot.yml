name: merge-dependabot-once

# One-shot: merges the currently-open Dependabot PRs using the built-in
# Actions token, then this file is removed. Runs on push because there is
# no local token to trigger workflow_dispatch.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          prs=$(gh pr list --repo "$REPO" --state open --json number,author \
                --jq '.[] | select(.author.login=="dependabot[bot]") | .number' | sort -n)
          echo "dependabot PRs: $prs"
          for pr in $prs; do
            merged=0
            for method in --squash --merge --rebase; do
              for attempt in 1 2 3; do
                if gh pr merge "$pr" --repo "$REPO" $method --delete-branch; then
                  echo "merged #$pr via $method"; merged=1; break
                fi
                sleep 8
              done
              [ "$merged" = 1 ] && break
            done
            [ "$merged" = 0 ] && echo "::error::could not merge #$pr by any method"
          done
